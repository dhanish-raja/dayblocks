version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayblocks_postgres
    environment:
      POSTGRES_USER: dayblocks
      POSTGRES_PASSWORD: dayblocks_secret
      POSTGRES_DB: dayblocks_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayblocks -d dayblocks_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
